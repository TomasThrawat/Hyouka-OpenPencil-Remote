name: OpenPencil MCP Smoke Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: curl --fail-with-body --silent --show-error --max-time 30 https://hyouka-openpencil-remote-v2.vercel.app/api/health
      - name: MCP initialize
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -D /tmp/h -o /tmp/b -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions-smoke","version":"1"}}}' \
            https://hyouka-openpencil-remote-v2.vercel.app/api/mcp
          cat /tmp/h
          cat /tmp/b
          grep -Eq 'HTTP/.* 200|HTTP/.* 202' /tmp/h
      - name: MCP tools list
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -D /tmp/h -o /tmp/b -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            https://hyouka-openpencil-remote-v2.vercel.app/api/mcp
          cat /tmp/h
          cat /tmp/b
          grep -q 'list_documents' /tmp/b
      - name: MCP tools call list_documents
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -D /tmp/h -o /tmp/b -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_documents","arguments":{}}}' \
            https://hyouka-openpencil-remote-v2.vercel.app/api/mcp
          cat /tmp/h
          cat /tmp/b
          grep -q 'OpenPencil Remote' /tmp/b
