name: Register OpenPencil Remote MCP

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Replace old OpenPencil toolkit
        env:
          COMPOSIO_PROJECT_API_KEY: ${{ secrets.COMPOSIO_PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          delete_toolkit() {
            local slug="$1"
            local code
            code="$(curl --silent --show-error \
              --output /tmp/delete-response \
              --write-out "%{http_code}" \
              --request DELETE \
              --url "https://backend.composio.dev/api/v3.1/custom/toolkits/${slug}" \
              --header "x-api-key: ${COMPOSIO_PROJECT_API_KEY}")"
            if [ "${code}" != "200" ] && [ "${code}" != "404" ]; then
              cat /tmp/delete-response
              exit 1
            fi
          }
          delete_toolkit "CUSTOM_OPENPENCIL"
          delete_toolkit "CUSTOM_OPENPENCIL_REMOTE"

      - name: Register OpenPencil on the canonical slug
        env:
          COMPOSIO_PROJECT_API_KEY: ${{ secrets.COMPOSIO_PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://backend.composio.dev/api/v3.1/custom/toolkits/upsert \
            --header "x-api-key: ${COMPOSIO_PROJECT_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{
              "slug": "OPENPENCIL",
              "toolkit_config": {
                "name": "OpenPencil",
                "app_url": "https://hyouka-openpencil-remote-v2.vercel.app/api/mcp",
                "auth_schemes": [
                  { "mode": "NO_AUTH" }
                ]
              }
            }'

      - name: Sync OpenPencil tools
        env:
          COMPOSIO_PROJECT_API_KEY: ${{ secrets.COMPOSIO_PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://backend.composio.dev/api/v3.1/custom/toolkits/sync \
            --header "x-api-key: ${COMPOSIO_PROJECT_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"slug":"CUSTOM_OPENPENCIL"}'

      - name: Verify canonical toolkit
        env:
          COMPOSIO_PROJECT_API_KEY: ${{ secrets.COMPOSIO_PROJECT_API_KEY }}
        run: |
          set -euo pipefail
          toolkit="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url https://backend.composio.dev/api/v3.1/toolkits/CUSTOM_OPENPENCIL \
            --header "x-api-key: ${COMPOSIO_PROJECT_API_KEY}")"
          echo "${toolkit}" | jq '{name,slug,type,base_url,enabled,tools_count:(.meta.tools_count),version:(.meta.version)}'
