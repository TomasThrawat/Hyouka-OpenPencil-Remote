name: Android APK

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          ANDROID_CLI="$(command -v android || true)"
          if [ -z "$ANDROID_CLI" ]; then
            ANDROID_CLI="$(find "$HOME" -type f -path '*/bin/android' -perm -u+x 2>/dev/null | head -n 1)"
          fi
          test -n "$ANDROID_CLI"
          echo "$(dirname "$ANDROID_CLI")" >> "$GITHUB_PATH"
          command -v android
          android --version

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          android --sdk="$SDK_ROOT" sdk install "platform-tools" "platforms/android-36" "build-tools/36.0.0" "ndk/30.0.16248370"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Diagnose raw typeof window checks
        shell: bash
        run: |
          set +e
          git grep -n -E "typeof[[:space:]]+window" --             src             packages/scene-graph/src             packages/core/src             packages/vue/src             packages/cli/src             packages/mcp/src             packages/harness/src             packages/dom-css/src             packages/pen/src             packages/kiwi/src             packages/fig/src             tests             scripts             tools             ':!**/constants.ts'
          status=$?
          echo "git grep exit status: $status"
          exit 0

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Initialize Tauri Android
        run: bun tauri android init --ci --skip-targets-install

      - name: Build frontend
        run: bun run build

      - name: Build Android APK
        run: bun tauri android build --ci --apk --target aarch64 --verbose

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find desktop/gen/android/app/build/outputs -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK was produced."
            exit 1
          fi
          printf '%s\n' "${apks[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openpencil-android-apk
          path: desktop/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          compression-level: 0
