name: OpenPencil MCP Runtime Regression

on:
  workflow_dispatch:

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages and frontend
        run: bun run build:packages && vite build

      - name: Verify Vercel ESM import path
        run: |
          set -euo pipefail
          grep -F "import('./headless.js')" api/mcp.ts
          rm -rf /tmp/openpencil-esm-regression
          mkdir -p /tmp/openpencil-esm-regression
          printf '%s\n' '{"type":"module"}' > /tmp/openpencil-esm-regression/package.json
          printf '%s\n' 'export const sendHeadlessRPC = () => ({ ok: true })' > /tmp/openpencil-esm-regression/headless.js
          printf '%s\n' 'export async function load() { const { sendHeadlessRPC } = await import("./headless.js"); return sendHeadlessRPC().ok }' > /tmp/openpencil-esm-regression/mcp.mjs
          result="$(node -e 'import("/tmp/openpencil-esm-regression/mcp.mjs").then(async m => console.log(await m.load()))')"
          test "$result" = "true"
